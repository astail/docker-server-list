<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Docker Server List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232496ed'/%3E%3Crect x='22' y='46' width='16' height='16' fill='white'/%3E%3Crect x='42' y='46' width='16' height='16' fill='white'/%3E%3Crect x='62' y='46' width='16' height='16' fill='white'/%3E%3Crect x='42' y='26' width='16' height='16' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>Docker Server List</h1>
      <p id="host-line" class="muted">接続中…</p>
    </div>
  </div>
  <div class="summary" id="summary"></div>
</header>

<section class="access" id="access" hidden>
  <div class="access-head">
    <h2>アクセス</h2>
    <span class="muted" id="access-count"></span>
  </div>
  <div class="access-grid" id="access-grid"></div>
</section>

<div class="toolbar">
  <div class="search">
    <input id="search" type="search" placeholder="名前 / イメージ / ポート / プロジェクトで絞り込み" autocomplete="off" spellcheck="false">
  </div>
  <div class="filters" role="group" aria-label="状態フィルタ">
    <button class="chip is-active" data-filter="all">すべて</button>
    <button class="chip" data-filter="running">稼働中</button>
    <button class="chip" data-filter="stopped">停止中</button>
    <button class="chip" data-filter="reachable">アクセス可</button>
  </div>
  <label class="toggle">
    <input type="checkbox" id="group-toggle" checked>
    <span>プロジェクトでグループ化</span>
  </label>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<main>
  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th class="col-state" data-sort="state">状態</th>
          <th data-sort="name">名前</th>
          <th data-sort="image">イメージ</th>
          <th data-sort="ports">ポート</th>
          <th class="num" data-sort="cpu">CPU</th>
          <th class="num" data-sort="mem">メモリ</th>
          <th class="num net-col" data-sort="net">ネットワーク I/O</th>
          <th class="num" data-sort="uptime">稼働時間</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p id="empty" class="empty" hidden>該当するコンテナがありません。</p>
</main>

<footer class="footer">
  <span id="footer-line" class="muted"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
